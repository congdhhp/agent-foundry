[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-foundry"
version = "0.1.0"
description = "Skill-centric, policy-aware, tool-agnostic platform foundation for governed AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Agent Foundry Contributors" }
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.1,<7"
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7,<8",
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "ruff>=0.5,<1",
  "types-PyYAML>=6,<7"
]

[project.scripts]
agent-foundry = "agent_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501", "UP038"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
disallow_untyped_defs = false

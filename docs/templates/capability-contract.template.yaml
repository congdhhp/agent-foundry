apiVersion: agents.platform/v1
kind: CapabilityContract
metadata:
  id: example.read
  version: 1.0.0
spec:
  category: example
  accessType: read
  riskLevel: low
  inputSchema:
    type: object
    required:
      - query
    properties:
      query:
        type: string
  outputSchema:
    type: object
    required:
      - result
      - evidence_id
      - metadata
    properties:
      result:
        type: object
      evidence_id:
        type: string
      metadata:
        type: object
  semanticContract:
    guarantees:
      - Reads information without mutating external systems.
    constraints:
      maxPayloadBytes: 1000000
      requiresTenantScope: true
  evidence:
    creates_evidence: true
    evidence_type: example_observation


apiVersion: agents.platform/v1
kind: CapabilityContract
metadata:
  id: file.read
  version: 1.0.0
  name: File Read
  owner: engineering-platform-team
spec:
  category: workspace
  accessType: read
  riskLevel: low
  inputSchema:
    type: object
    required:
      - path
    properties:
      path:
        type: string
  outputSchema:
    type: object
    required:
      - content
      - evidence_id
      - metadata
    properties:
      content:
        type: string
      evidence_id:
        type: string
      metadata:
        type: object
  semanticContract:
    guarantees:
      - Reads files only within the authorized workspace root.
    constraints:
      preventPathTraversal: true
  evidence:
    creates_evidence: true
    evidence_type: file_observation


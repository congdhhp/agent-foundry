apiVersion: agents.platform/v1
kind: CapabilityContract
metadata:
  id: git.diff
  version: 1.0.0
  name: Git Diff
  owner: engineering-platform-team
spec:
  category: workspace
  accessType: read
  riskLevel: low
  inputSchema:
    type: object
    properties:
      path:
        type: string
  outputSchema:
    type: object
    required:
      - diff
      - evidence_id
      - metadata
    properties:
      diff:
        type: string
      evidence_id:
        type: string
      metadata:
        type: object
  semanticContract:
    guarantees:
      - Returns workspace diff without mutating repository state.
    constraints:
      preventPathTraversal: true
  evidence:
    creates_evidence: true
    evidence_type: git_diff


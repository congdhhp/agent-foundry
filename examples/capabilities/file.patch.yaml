apiVersion: agents.platform/v1
kind: CapabilityContract
metadata:
  id: file.patch
  version: 1.0.0
  name: File Patch
  owner: engineering-platform-team
spec:
  category: workspace
  accessType: write
  riskLevel: medium
  inputSchema:
    type: object
    required:
      - path
      - patch
    properties:
      path:
        type: string
      patch:
        type: string
  outputSchema:
    type: object
    required:
      - applied
      - evidence_id
      - metadata
    properties:
      applied:
        type: boolean
      evidence_id:
        type: string
      metadata:
        type: object
  semanticContract:
    guarantees:
      - Applies a patch only within the authorized workspace root.
    constraints:
      preventPathTraversal: true
      requireDiffAudit: true
  evidence:
    creates_evidence: true
    evidence_type: file_change


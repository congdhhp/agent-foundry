apiVersion: agents.platform/v1
kind: Policy
metadata:
  id: workspace-write
  version: 1.0.0
  name: Workspace Write
  owner: engineering-platform-team
spec:
  rules:
    - match:
        capability: file.read@1.0
      decision: allow
    - match:
        capability: git.diff@1.0
      decision: allow
    - match:
        capability: file.patch@1.0
      decision: allow
    - match:
        capability: shell.run@1.0
      decision: require_approval
      approvers:
        - role:workspace_owner
    - match:
        riskLevel: critical
      decision: deny


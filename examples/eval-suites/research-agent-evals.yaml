apiVersion: agents.platform/v1
kind: EvalSuite
metadata:
  id: research-agent-evals
  version: 1.0.0
  name: Research Agent Evals
  owner: ai-platform-team
  labels:
    domain: research
spec:
  description: Release gate for the reference research agent.
  cases:
    - ../evals/research_basic.yaml
  passCriteria:
    minPassRate: 1.0
    requiredChecks:
      - selected_skill
      - must_call
      - must_not_call
      - provider_must_call
      - expected_status
      - min_evidence_count
      - must_not_execute_side_effects

apiVersion: agents.platform/v1
kind: ToolProvider
metadata:
  id: knowledge-mcp
  version: 1.0.0
  name: Knowledge MCP Provider
  owner: ai-platform-team
spec:
  protocol: mcp
  transport: stdio
  endpoint: agent-foundry-mcp-knowledge
  capabilities:
    - contract: document.read@1.0
      tool: read_document
      riskLevel: low
  tenantScope: local
  runtimeControls:
    timeoutSeconds: 30
    allowNetwork: false
  healthCheck:
    enabled: true
    mode: configuration
  outputSanitization:
    redactSecrets: true
    maxPayloadBytes: 1000000
    tagUntrusted: true

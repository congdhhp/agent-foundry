apiVersion: agents.platform/v1
kind: ToolProvider
metadata:
  id: git
  version: 1.0.0
  name: Git Provider
  owner: engineering-platform-team
spec:
  protocol: in_process
  transport: local
  capabilities:
    - contract: git.diff@1.0
      tool: diff
      riskLevel: low
  tenantScope: local
  outputSanitization:
    redactSecrets: true
    maxPayloadBytes: 1000000
    tagUntrusted: false

